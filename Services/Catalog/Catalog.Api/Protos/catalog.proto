syntax = "proto3";

option csharp_namespace = "Catalog.Grpc";

package catalog;

// Читання даних каталогу для внутрішніх сервісів платформи.
service CatalogService {
  // Картка товару; NOT_FOUND, якщо товару немає.
  rpc GetProduct (GetProductRequest) returns (ProductReply);
  // Кілька товарів за ідентифікаторами; відсутні Id повертаються в missing_ids.
  rpc GetProductsByIds (GetProductsByIdsRequest) returns (ProductsReply);
}

message GetProductRequest {
  int64 id = 1;
}

message GetProductsByIdsRequest {
  repeated int64 ids = 1;
}

message ProductReply {
  int64 id = 1;
  string sku = 2;
  string name = 3;
  string brand_name = 4;
  // Поточна ціна в гривнях.
  double price = 5;
  int32 available_stock = 6;
  bool is_active = 7;
}

message ProductsReply {
  repeated ProductReply products = 1;
  repeated int64 missing_ids = 2;
}
