syntax = "proto3";

option csharp_namespace = "Orders.Grpc";

package orders;

import "google/protobuf/timestamp.proto";

// Читання замовлень для внутрішніх сервісів платформи (Aggregator).
service OrdersService {
  // Повертає замовлення з позиціями; NOT_FOUND, якщо замовлення немає.
  rpc GetOrder (GetOrderRequest) returns (OrderReply);
}

message GetOrderRequest {
  int64 id = 1;
}

message OrderReply {
  int64 id = 1;
  int64 customer_id = 2;
  string status = 3;
  google.protobuf.Timestamp order_date = 4;
  // Сума в гривнях; для грошей у production краще окремий message з units/nanos.
  double total_amount = 5;
  string city = 6;
  repeated OrderItemReply items = 7;
}

message OrderItemReply {
  int64 product_id = 1;
  // Назва й ціна — знімок на момент замовлення.
  string product_name = 2;
  double unit_price = 3;
  double discount = 4;
  int32 units = 5;
  double line_total = 6;
}
